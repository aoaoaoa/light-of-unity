<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Light of Unity · Recitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300..900&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,300..500&display=swap">
<style>
/* Layout: one passage per screen, read aloud at the pace of the words. The statement
   resolves word by word; its echo follows. The rail at the foot is the letter's order,
   each stop marked with the year of its echo. */
:root {
  --sage: #86a98e;
  --forest: #26410f;
  --teal: #136649;
  --plum: #4a3459;
  --paper: #f0ebe5;
  --paper-dim: rgba(240, 235, 229, .6);
  --paper-faint: rgba(240, 235, 229, .18);
  --ground: var(--forest);

  --display: "League Spartan", "Futura", "Century Gothic", system-ui, sans-serif;
  --text: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--paper);
  font-family: var(--display);
  -webkit-font-smoothing: antialiased;
  transition: background-color .9s ease;
  overflow: hidden;
}
body[data-ground="sage"]   { --ground: var(--sage); }
body[data-ground="forest"] { --ground: var(--forest); }
body[data-ground="teal"]   { --ground: var(--teal); }
body[data-ground="plum"]   { --ground: var(--plum); }

.stage {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  position: relative;
}
.mark {
  position: fixed; top: -.1em; left: -.04em; margin: 0;
  font-family: var(--text); font-size: clamp(18rem, 46vw, 40rem); line-height: 1;
  color: transparent; -webkit-text-stroke: 2px var(--paper-faint);
  pointer-events: none; user-select: none;
  transition: opacity .6s;
}
body[data-ground="sage"] .mark { opacity: 0; }

.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; position: relative; z-index: 1; }
.label { margin: 0; font-size: .74rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--paper-dim); font-variant-numeric: tabular-nums; }
a.label { text-decoration: none; }
a.label:hover { color: var(--paper); }

.viewport { position: relative; overflow-y: auto; display: grid; align-items: safe center; }
.slide { max-width: 1100px; width: 100%; margin: 0 auto; padding-block: 40px; display: grid; gap: clamp(28px, 5vh, 56px); }
.slide[hidden] { display: none !important; }

.question {
  margin: 0; font-weight: 800; text-transform: uppercase;
  font-size: clamp(3.2rem, min(14vw, 15vh), 11rem); line-height: .8; letter-spacing: -.055em;
}
.question span { display: block; }
.prov { margin: 0; max-width: 34rem; font-weight: 600; font-size: clamp(1rem, 1.6vw, 1.25rem); line-height: 1.35; }

.statement {
  margin: 0; max-width: 22ch;
  font-weight: 700; font-size: clamp(1.8rem, min(5vw, 7vh), 4.4rem); line-height: 1.05; letter-spacing: -.02em;
}
.long .statement { max-width: 26ch; font-size: clamp(1.5rem, min(3.6vw, 5vh), 3rem); }
.long .echo p { font-size: clamp(.98rem, 1.25vw, 1.12rem); }
.rail ol button.nd { text-transform: none; letter-spacing: .06em; }
.w { opacity: 1; transition: opacity .5s ease; }
.reading .w { opacity: .16; }
.reading .w.lit { opacity: 1; }

.echo { margin: 0 0 0 auto; max-width: 46rem; display: grid; gap: 14px; transition: opacity .8s ease, transform .8s ease; }
.reading .echo { opacity: 0; transform: translateY(10px); }
.reading .echo.shown { opacity: 1; transform: none; }
.echo blockquote { margin: 0; }
.echo p { margin: 0; font-family: var(--text); font-style: italic; font-weight: 350; font-size: clamp(1.02rem, 1.5vw, 1.3rem); line-height: 1.5; }
.echo figcaption { font-size: .8rem; font-weight: 600; letter-spacing: .05em; color: var(--paper-dim); line-height: 1.45; }
.echo cite { font-style: normal; color: var(--paper); }
.echo .yr { font-weight: 800; font-size: 1.05rem; color: var(--paper); margin-right: 10px; letter-spacing: 0; }

.rail { position: relative; z-index: 1; display: grid; gap: 14px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.rail ol button {
  width: 100%; padding: 12px 0 0; background: none; border: 0; border-top: 2px solid var(--paper-faint);
  color: var(--paper-dim); font: 600 .72rem/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase;
  text-align: left; cursor: pointer; font-variant-numeric: tabular-nums;
  transition: border-color .3s, color .3s;
}
.rail ol button[aria-current="step"] { border-top-color: var(--paper); color: var(--paper); }
.rail ol button:hover { color: var(--paper); }
.controls { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.controls button {
  background: none; border: 1px solid var(--paper-dim); color: var(--paper);
  font: 600 .74rem var(--display); letter-spacing: .18em; text-transform: uppercase;
  padding: 10px 16px; border-radius: 999px; cursor: pointer;
}
.controls button:disabled { opacity: .3; cursor: default; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }

@media (max-width: 560px) { .rail ol button { font-size: .62rem; letter-spacing: .08em; } }
@media (prefers-reduced-motion: reduce) {
  body, .w, .echo, .mark { transition: none; }
  .reading .long .statement { max-width: 26ch; font-size: clamp(1.5rem, min(3.6vw, 5vh), 3rem); }
.long .echo p { font-size: clamp(.98rem, 1.25vw, 1.12rem); }
.rail ol button.nd { text-transform: none; letter-spacing: .06em; }
.w { opacity: 1; } .reading .echo { opacity: 1; transform: none; }
}
</style>
</head>
<body data-ground="sage">
<p class="mark" aria-hidden="true">“</p>
<div class="stage">
  <div class="bar"><a class="label" href="index.html">All variants</a><p class="label" id="count" aria-live="polite"></p></div>
  <main class="viewport" id="viewport"></main>
  <nav class="rail" aria-label="Passages">
    <ol id="rail"></ol>
    <div class="controls"><button type="button" id="prev">Back</button><p class="label">Arrow keys or space</p><button type="button" id="next">Next</button></div>
  </nav>
</div>
<script src="content.js"></script>
<script>
(function () {
  var U = window.UNITY, L = U.letter;
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var words = U.question.replace("?", "").toUpperCase().split(" ");
  var lines = [words[0], words[1], words[2] + " " + words[3], words[4] + " " + words[5], words[6] + "?"];
  var slides = [{ id: "cover", ground: "sage", rail: L.dateLabel }].concat(U.entries.map(function (e) {
    return { id: e.id, ground: e.ground, entry: e, rail: e.echo ? (e.echo.year ? String(e.echo.year) : "n.d.") : "Opening" };
  }));

  var vp = document.getElementById("viewport");
  vp.innerHTML = slides.map(function (s, i) {
    var long = s.entry && (s.entry.statement.length + (s.entry.echo ? s.entry.echo.text.length : 0)) > 520;
    var h = '<section class="slide' + (long ? " long" : "") + '" id="s-' + s.id + '" aria-label="' + (i ? "Passage " + i : "Title") + '" hidden>';
    if (!s.entry) {
      h += '<h1 class="question" aria-label="' + esc(U.question) + '">' + lines.map(function (l) { return "<span>" + l + "</span>"; }).join("") + "</h1>" +
        '<p class="prov">From a letter of the ' + esc(L.body) + ", dated " + esc(L.dateLabel) + ". " + esc(U.note) + "</p>";
    } else {
      var e = s.entry;
      h += '<p class="statement">' + e.statement.split(" ").map(function (w) { return '<span class="w">' + esc(w) + "</span>"; }).join(" ") + "</p>";
      if (e.echo) {
        var c = e.echo;
        h += '<figure class="echo"><blockquote><p>' + esc(c.text) + "</p></blockquote><figcaption><span class=\"yr\">" + (c.year || "n.d.") + "</span>" +
          esc(c.author) + ", <cite>" + esc(c.work) + "</cite>" + (c.in ? ", in <cite>" + esc(c.in) + "</cite>" : "") + "</figcaption></figure>";
      }
    }
    return h + "</section>";
  }).join("");

  var rail = document.getElementById("rail");
  rail.innerHTML = slides.map(function (s, i) { return '<li><button type="button" data-i="' + i + '"' + (s.rail === "n.d." ? ' class="nd"' : "") + ">" + esc(s.rail) + "</button></li>"; }).join("");
  rail.addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (b) go(+b.dataset.i); });

  var cur = -1, timers = [];
  function clear() { timers.forEach(clearTimeout); timers = []; }
  function go(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i === cur) return;
    clear();
    if (cur >= 0) document.getElementById("s-" + slides[cur].id).hidden = true;
    cur = i;
    var s = slides[i], el = document.getElementById("s-" + s.id);
    document.body.dataset.ground = s.ground;
    el.hidden = false;
    vp.scrollTop = 0;
    document.getElementById("count").textContent = i ? "Passage " + i + " of " + (slides.length - 1) : L.dateLabel;
    rail.querySelectorAll("button").forEach(function (b, k) { if (k === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === slides.length - 1;
    try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
    if (s.entry && !still) read(el);
  }
  function read(el) {
    var ws = el.querySelectorAll(".w"), echo = el.querySelector(".echo");
    ws.forEach(function (w) { w.classList.remove("lit"); });
    if (echo) echo.classList.remove("shown");
    el.classList.add("reading");
    ws.forEach(function (w, k) { timers.push(setTimeout(function () { w.classList.add("lit"); }, 140 + k * 70)); });
    timers.push(setTimeout(function () { if (echo) echo.classList.add("shown"); }, 140 + ws.length * 70 + 400));
  }
  function finish() {
    var el = document.getElementById("s-" + slides[cur].id);
    if (!el.classList.contains("reading")) return false;
    var pending = el.querySelector(".w:not(.lit)") || (el.querySelector(".echo:not(.shown)"));
    if (!pending) return false;
    clear();
    el.querySelectorAll(".w").forEach(function (w) { w.classList.add("lit"); });
    var e = el.querySelector(".echo"); if (e) e.classList.add("shown");
    return true;
  }
  function next() { if (!finish()) go(cur + 1); }
  document.getElementById("prev").onclick = function () { go(cur - 1); };
  document.getElementById("next").onclick = next;
  addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
    if (["ArrowRight", "ArrowDown", "PageDown", " "].indexOf(e.key) > -1) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp"].indexOf(e.key) > -1) { e.preventDefault(); go(cur - 1); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(slides.length - 1);
  });
  function fromHash() {
    var id = location.hash.slice(1), k = slides.findIndex(function (s) { return s.id === id; });
    return k < 0 ? 0 : k;
  }
  addEventListener("hashchange", function () { go(fromHash()); });
  go(fromHash());
})();
</script>
</body>
</html>
